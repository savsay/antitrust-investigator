name: dogrula-ve-paketle

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testler
        run: python tests/test_skill.py
      - name: Kaynak katalogu
        run: python plugins/rekabet-ihlali-inceleme/skills/rekabet-ihlali-inceleme/scripts/kaynak_yonet.py dogrula
      - name: Skill zip
        run: python tools/paketle.py
      - uses: actions/upload-artifact@v4
        with:
          name: rekabet-ihlali-inceleme-skill
          path: dist/rekabet-ihlali-inceleme.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/paketle.py
      - name: Surum yayini
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/rekabet-ihlali-inceleme.zip --generate-notes
